key_expectations:
  - column: SHOP_CODE
    expectation: present, non-null, and unique; represents the pilot branch code

schema_expectations:
  expected_column_count: 26
  missing_required_columns_policy: fail_validation
  unexpected_columns_policy: report_only
  unique_columns:
    - SHOP_CODE
  expected_distinct_values:
    SHOP_CODE:
      expected_count: 10
      validation_action: report_only

notes:
  - Contract describes expected input schema only; it does not clean or transform source data.
  - The expected ten pilot branch codes are a validation expectation, not a data-modification instruction.
  - Profile attributes are documented as supplied and are not treated as current Singer policy or operational constraints.
